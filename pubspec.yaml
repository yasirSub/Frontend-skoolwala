name: skoolwala
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.0
  image: ^4.5.4
  permission_handler: ^12.0.1
  tflite_flutter: ^0.11.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.5.0
  geolocator: ^14.0.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  printing: ^5.11.0
  pdf: ^3.10.7
  # Face recognition and ML dependencies
  crypto: ^3.0.3
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.3
  animated_bottom_navigation_bar: ^1.4.0
  # tflite_flutter_helper: ^0.3.1  # Commented out due to version conflict
  # TODO: Add location packages later
  # geolocator: ^10.1.0
  # permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  

flutter:
  uses-material-design: true
  assets:
    - assets/models/FaceMobileNet_Float32.tflite
    - assets/FACEdect.png
    - assets/skoolwala_logo.png

dependency_overrides:
  typed_data: ^1.3.2

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/skoolwala_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6D63B8"
  adaptive_icon_foreground: "assets/skoolwala_logo.png"

flutter_native_splash:
  color: "#6D63B8"
  image: "assets/skoolwala_logo.png"
  android_12:
    image: "assets/skoolwala_logo.png"
    icon_background_color: "#6D63B8"
    color: "#6D63B8"
  android: true
  ios: true
  web: false
